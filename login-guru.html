<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEMSIRA - Login Guru</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fas fa-chalkboard-teacher"></i>
                <h2>Login Guru</h2>
                <p>Masuk untuk urus kelas & pelajar</p>
            </div>
            
            <form id="guru-login-form" onsubmit="handleGuruLogin(event)">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="email" placeholder="nama@guru.com" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Kata Laluan</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                
                <div class="form-options">
                    <label class="checkbox">
                        <input type="checkbox"> Ingat saya
                    </label>
                    <a href="#">Lupa kata laluan?</a>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>
            
            <div class="auth-footer">
                <p>Takda akaun? <a href="signup-guru.html">Daftar sekarang</a></p>
                <p><a href="index.html"><i class="fas fa-arrow-left"></i> Kembali ke utama</a></p>
            </div>
            
            <div class="auth-note">
                <small><i class="fas fa-info-circle"></i> Guna email & password yang didaftar. Data simpan dalam akaun Google awda.</small>
            </div>
        </div>
    </div>
    
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
