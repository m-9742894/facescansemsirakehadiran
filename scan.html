<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Scan Wajah - SEMSIRA</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Face API.js -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        :root {
            --primary: #4158F0;
            --primary-dark: #2a3bb0;
            --secondary: #C850C0;
            --success: #06d6a0;
            --danger: #FF6B6B;
            --warning: #FFB347;
            --dark: #1e1e2f;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.05);
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            position: relative;
            overflow-x: hidden;
        }

        /* Background Animation */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            filter: blur(80px);
            opacity: 0.15;
            animation: float 20s infinite ease-in-out;
        }

        .circle1 {
            width: 500px;
            height: 500px;
            top: -100px;
            right: -100px;
        }

        .circle2 {
            width: 400px;
            height: 400px;
            bottom: -100px;
            left: -100px;
            background: linear-gradient(135deg, var(--secondary), #FFCC70);
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(50px, 50px); }
        }

        /* Header Simple */
        .header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .logo i {
            font-size: 2rem;
        }

        .back-home {
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 50px;
            background: var(--glass);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .back-home:hover {
            background: var(--primary);
        }

        /* Main Content */
        .main-content {
            max-width: 800px;
            margin: 10px auto;
            padding: 0 15px;
        }

        /* Camera Container - FULL */
        .camera-container {
            position: relative;
            width: 100%;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border: 3px solid var(--primary);
            margin: 10px 0;
            aspect-ratio: 4/3;
            background: #000;
        }

        #scanVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transform: scaleX(-1); /* Mirror effect */
        }

        #scanCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* Mirror effect */
        }

        /* Face Guide */
        .face-guide {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            border: 3px dashed var(--primary);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.5);
            animation: pulse 2s infinite;
            z-index: 5;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.05); opacity: 0.7; }
        }

        .guide-text {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 1rem;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
            background: rgba(0,0,0,0.6);
            padding: 8px 20px;
            border-radius: 50px;
            white-space: nowrap;
            z-index: 10;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Loading Overlay */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            backdrop-filter: blur(5px);
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid var(--glass);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s infinite linear;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Camera Controls */
        .camera-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            color: white;
            min-width: 120px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
        }

        .btn-danger {
            background: var(--danger);
            border: none;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        /* Status Bar */
        .status-bar {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 15px 20px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .status-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-icon i {
            font-size: 1.8rem;
        }

        .status-text {
            flex: 1;
            font-size: 1rem;
            font-weight: 500;
        }

        .status-time {
            color: var(--primary);
            font-weight: 600;
            font-size: 1.2rem;
            background: rgba(0,0,0,0.3);
            padding: 5px 15px;
            border-radius: 50px;
        }

        /* Result Card */
        .result-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 2px solid var(--success);
            border-radius: 30px;
            padding: 25px;
            margin: 15px 0;
            display: none;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }

        .result-header i {
            font-size: 3rem;
            color: var(--success);
        }

        .result-header h2 {
            color: var(--success);
            font-size: 1.8rem;
        }

        .result-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .detail-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 15px;
        }

        .detail-item .label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .detail-item .value {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .value.hadir {
            color: var(--success);
        }

        .value.lewat {
            color: var(--warning);
        }

        /* Recent Scans */
        .recent-section {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 20px;
            margin-top: 20px;
        }

        .recent-section h3 {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .recent-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .recent-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .recent-item i {
            font-size: 1.5rem;
        }

        .recent-info {
            flex: 1;
        }

        .recent-info .name {
            font-weight: 600;
        }

        .recent-info .meta {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .recent-time {
            font-size: 0.9rem;
            color: var(--primary);
            font-weight: 500;
        }

        /* Permission Message */
        .permission-message {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .permission-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 2px solid var(--primary);
            border-radius: 40px;
            padding: 40px;
            max-width: 400px;
            text-align: center;
        }

        .permission-card i {
            font-size: 5rem;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .permission-card h2 {
            margin-bottom: 15px;
        }

        .permission-card p {
            color: rgba(255,255,255,0.7);
            margin-bottom: 25px;
        }

        .permission-card button {
            padding: 15px 40px;
            font-size: 1.2rem;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .face-guide {
                width: 200px;
                height: 200px;
            }
            
            .result-details {
                grid-template-columns: 1fr;
            }
            
            .guide-text {
                font-size: 0.9rem;
                white-space: normal;
                text-align: center;
                width: 90%;
            }
            
            .status-time {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Background Animation -->
    <div class="bg-animation">
        <div class="bg-circle circle1"></div>
        <div class="bg-circle circle2"></div>
    </div>

    <!-- Header Simple -->
    <div class="header">
        <div class="logo">
            <i class="fas fa-face-smile"></i>
            <span>SEMSIRA</span>
        </div>
        <a href="index.html" class="back-home">
            <i class="fas fa-home"></i> Utama
        </a>
    </div>

    <!-- Permission Message -->
    <div id="permissionMessage" class="permission-message">
        <div class="permission-card">
            <i class="fas fa-camera"></i>
            <h2>Akses Kamera</h2>
            <p>SEMSIRA memerlukan akses kamera untuk imbasan wajah. Sila benarkan kamera apabila diminta.</p>
            <button class="btn btn-primary" onclick="requestCamera()">
                <i class="fas fa-camera"></i> Benarkan Kamera
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        
        <!-- Camera Container -->
        <div class="camera-container">
            <video id="scanVideo" autoplay playsinline></video>
            <canvas id="scanCanvas"></canvas>
            
            <!-- Face Guide -->
            <div class="face-guide"></div>
            <div class="guide-text">
                <i class="fas fa-face-smile"></i> Letak muka dalam bulatan
            </div>

            <!-- Loading Overlay -->
            <div id="loadingOverlay" class="loading-overlay" style="display: none;">
                <div class="spinner"></div>
                <p>Memproses imbasan...</p>
            </div>
        </div>

        <!-- Camera Controls -->
        <div class="camera-controls">
            <button class="btn btn-danger" onclick="stopCamera()" id="stopCameraBtn">
                <i class="fas fa-stop"></i> Berhenti
            </button>
            <button class="btn" onclick="switchCamera()" id="switchCameraBtn">
                <i class="fas fa-sync-alt"></i> Tukar Kamera
            </button>
        </div>

        <!-- Status Bar -->
        <div class="status-bar" id="statusBar">
            <div class="status-icon" id="statusIcon">
                <i class="fas fa-spinner fa-spin"></i>
            </div>
            <div class="status-text" id="statusText">Memuatkan kamera...</div>
            <div class="status-time" id="statusTime"></div>
        </div>

        <!-- Result Card (Success) -->
        <div class="result-card" id="resultCard">
            <div class="result-header">
                <i class="fas fa-check-circle"></i>
                <h2>Kehadiran Direkod!</h2>
            </div>
            <div class="result-details">
                <div class="detail-item">
                    <div class="label"><i class="fas fa-user"></i> Nama</div>
                    <div class="value" id="resultName">-</div>
                </div>
                <div class="detail-item">
                    <div class="label"><i class="fas fa-tag"></i> Status</div>
                    <div class="value hadir" id="resultStatus">-</div>
                </div>
                <div class="detail-item">
                    <div class="label"><i class="fas fa-calendar"></i> Tarikh</div>
                    <div class="value" id="resultDate">-</div>
                </div>
                <div class="detail-item">
                    <div class="label"><i class="fas fa-clock"></i> Masa</div>
                    <div class="value" id="resultTime">-</div>
                </div>
            </div>
        </div>

        <!-- Recent Scans -->
        <div class="recent-section">
            <h3><i class="fas fa-history"></i> Imbasan Terkini</h3>
            <div class="recent-list" id="recentList">
                <!-- Akan diisi oleh JavaScript -->
            </div>
        </div>
    </main>

    <script>
        // ===== GLOBAL VARIABLES =====
        let modelsLoaded = false;
        let scanVideo = document.getElementById('scanVideo');
        let scanCanvas = document.getElementById('scanCanvas');
        let ctx = scanCanvas.getContext('2d');
        let currentStream = null;
        let scanInterval = null;
        let currentFacingMode = 'user';
        let recentScans = [];
        let cameraStarted = false;

        // ===== SAMPLE NAMES FOR DEMO =====
        const sampleNames = [
            'Ahmad bin Ali',
            'Siti Aisyah',
            'Muhammad Faiz',
            'Nurul Iman',
            'Adam Hakimi',
            'Aina Maisara',
            'Muhammad Hakim',
            'Nur Aisyah'
        ];

        // ===== INITIALIZE =====
        document.addEventListener('DOMContentLoaded', function() {
            updateTime();
            setInterval(updateTime, 1000);
            loadRecentScans();
            loadFaceApiModels();
            
            // Auto request camera after 1 second
            setTimeout(() => {
                if (!cameraStarted) {
                    requestCamera();
                }
            }, 1000);
        });

        // ===== UPDATE TIME =====
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('statusTime').textContent = timeStr;
        }

        // ===== REQUEST CAMERA =====
        async function requestCamera() {
            // Hide permission message
            document.getElementById('permissionMessage').style.display = 'none';
            
            // Update status
            updateStatus('Meminta akses kamera...', 'spinner fa-spin');
            
            try {
                const constraints = {
                    video: {
                        facingMode: currentFacingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                };
                
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                scanVideo.srcObject = currentStream;
                
                // Set canvas size when video is ready
                scanVideo.onloadedmetadata = () => {
                    scanCanvas.width = scanVideo.videoWidth;
                    scanCanvas.height = scanVideo.videoHeight;
                };
                
                cameraStarted = true;
                
                // Update UI
                document.getElementById('stopCameraBtn').style.display = 'inline-flex';
                
                if (modelsLoaded) {
                    updateStatus('Mengimbas...', 'spinner fa-spin');
                    startScanning();
                } else {
                    updateStatus('Memuat model AI...', 'spinner fa-spin');
                }
                
            } catch (error) {
                console.error('Camera error:', error);
                updateStatus('Gagal akses kamera. Sila cuba lagi.', 'exclamation-circle', 'var(--danger)');
                
                // Show permission message again if denied
                setTimeout(() => {
                    if (!cameraStarted) {
                        document.getElementById('permissionMessage').style.display = 'flex';
                    }
                }, 2000);
            }
        }

        // ===== LOAD FACE API MODELS =====
        async function loadFaceApiModels() {
            updateStatus('Memuat turun model AI...', 'spinner fa-spin');
            
            try {
                const modelPath = 'https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/models/';
                
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(modelPath),
                    faceapi.nets.faceLandmark68Net.loadFromUri(modelPath),
                    faceapi.nets.faceRecognitionNet.loadFromUri(modelPath),
                    faceapi.nets.faceExpressionNet.loadFromUri(modelPath)
                ]);
                
                modelsLoaded = true;
                
                if (cameraStarted) {
                    updateStatus('Mengimbas...', 'spinner fa-spin');
                    startScanning();
                } else {
                    updateStatus('Sedia. Tekan benarkan kamera.', 'info-circle', 'var(--primary)');
                }
                
            } catch (error) {
                console.error('Error loading models:', error);
                updateStatus('Gagal muat turun model. Sila refresh.', 'exclamation-circle', 'var(--danger)');
            }
        }

        // ===== UPDATE STATUS BAR =====
        function updateStatus(text, icon, color = 'var(--primary)') {
            document.getElementById('statusText').textContent = text;
            const statusIcon = document.getElementById('statusIcon');
            statusIcon.innerHTML = `<i class="fas fa-${icon}" style="color: ${color}"></i>`;
        }

        // ===== STOP CAMERA =====
        function stopCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            
            if (scanInterval) {
                clearInterval(scanInterval);
                scanInterval = null;
            }
            
            // Clear canvas
            ctx.clearRect(0, 0, scanCanvas.width, scanCanvas.height);
            
            cameraStarted = false;
            
            // Update UI
            updateStatus('Kamera dihentikan', 'info-circle');
            
            // Hide result card
            document.getElementById('resultCard').style.display = 'none';
            
            // Show permission message again
            document.getElementById('permissionMessage').style.display = 'flex';
        }

        // ===== SWITCH CAMERA =====
        function switchCamera() {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            
            if (currentStream) {
                stopCamera();
                setTimeout(() => requestCamera(), 500);
            }
        }

        // ===== START SCANNING =====
        function startScanning() {
            if (scanInterval) clearInterval(scanInterval);
            
            scanInterval = setInterval(async () => {
                if (!currentStream || !modelsLoaded) return;
                
                try {
                    // Detect faces
                    const detections = await faceapi.detectAllFaces(
                        scanVideo,
                        new faceapi.TinyFaceDetectorOptions()
                    );
                    
                    // Clear canvas
                    ctx.clearRect(0, 0, scanCanvas.width, scanCanvas.height);
                    
                    if (detections.length > 0) {
                        // Draw detections (boxes around faces)
                        faceapi.draw.drawDetections(scanCanvas, detections);
                        
                        // Get the largest face (closest to camera)
                        const mainFace = detections.reduce((prev, current) => {
                            const prevArea = prev.box.width * prev.box.height;
                            const currentArea = current.box.width * current.box.height;
                            return currentArea > prevArea ? current : prev;
                        });
                        
                        // Check if face is centered (within guide)
                        const videoWidth = scanVideo.videoWidth;
                        const videoHeight = scanVideo.videoHeight;
                        const centerX = videoWidth / 2;
                        const centerY = videoHeight / 2;
                        const faceCenterX = mainFace.box.x + mainFace.box.width / 2;
                        const faceCenterY = mainFace.box.y + mainFace.box.height / 2;
                        
                        // Calculate distance from center
                        const distance = Math.sqrt(
                            Math.pow(faceCenterX - centerX, 2) + 
                            Math.pow(faceCenterY - centerY, 2)
                        );
                        
                        // If face is centered and big enough
                        if (distance < 150 && mainFace.box.width > 100) {
                            // Show loading
                            document.getElementById('loadingOverlay').style.display = 'flex';
                            
                            // Simulate processing delay
                            setTimeout(() => {
                                document.getElementById('loadingOverlay').style.display = 'none';
                                processSuccessfulScan();
                            }, 1000);
                            
                            // Pause scanning for a moment
                            clearInterval(scanInterval);
                            setTimeout(() => {
                                startScanning();
                            }, 3000);
                        }
                    }
                } catch (error) {
                    console.error('Scan error:', error);
                }
            }, 1000);
        }

        // ===== PROCESS SUCCESSFUL SCAN =====
        function processSuccessfulScan() {
            // Randomly select a name from sample
            const randomName = sampleNames[Math.floor(Math.random() * sampleNames.length)];
            
            // Get current date and time
            const now = new Date();
            const dateStr = now.toLocaleDateString('ms-MY', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            });
            const timeStr = now.toLocaleTimeString('ms-MY', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            
            // Determine status (Hadir/Lewat based on time)
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const isLate = (hours > 7) || (hours === 7 && minutes > 30);
            const status = isLate ? 'Lewat' : 'Hadir';
            const statusColor = isLate ? 'var(--warning)' : 'var(--success)';
            
            // Update result card
            document.getElementById('resultName').textContent = randomName;
            document.getElementById('resultStatus').textContent = status;
            document.getElementById('resultStatus').className = `value ${isLate ? 'lewat' : 'hadir'}`;
            document.getElementById('resultDate').textContent = dateStr;
            document.getElementById('resultTime').textContent = timeStr;
            
            // Show result card
            document.getElementById('resultCard').style.display = 'block';
            
            // Add to recent scans
            addToRecentScans(randomName, status, timeStr);
            
            // Flash effect
            scanCanvas.style.opacity = '0.3';
            setTimeout(() => scanCanvas.style.opacity = '1', 200);
            
            // Update status
            updateStatus('Imbasan berjaya!', 'check-circle', 'var(--success)');
            
            // Auto hide result card after 5 seconds
            setTimeout(() => {
                document.getElementById('resultCard').style.display = 'none';
            }, 5000);
        }

        // ===== ADD TO RECENT SCANS =====
        function addToRecentScans(name, status, time) {
            const newScan = { name, status, time };
            recentScans.unshift(newScan);
            
            // Keep only last 5 scans
            if (recentScans.length > 5) {
                recentScans.pop();
            }
            
            // Save to localStorage
            localStorage.setItem('semsira_recent_scans', JSON.stringify(recentScans));
            
            // Update UI
            const recentList = document.getElementById('recentList');
            recentList.innerHTML = recentScans.map(scan => `
                <div class="recent-item">
                    <i class="fas fa-check-circle" style="color: ${scan.status === 'Hadir' ? 'var(--success)' : 'var(--warning)'}"></i>
                    <div class="recent-info">
                        <div class="name">${scan.name}</div>
                        <div class="meta">${scan.status}</div>
                    </div>
                    <div class="recent-time">${scan.time}</div>
                </div>
            `).join('');
        }

        // ===== LOAD RECENT SCANS =====
        function loadRecentScans() {
            // Load from localStorage if available
            const saved = localStorage.getItem('semsira_recent_scans');
            if (saved) {
                recentScans = JSON.parse(saved);
            } else {
                // Sample recent scans
                recentScans = [
                    { name: 'Ahmad bin Ali', status: 'Hadir', time: '07:15:23' },
                    { name: 'Siti Aisyah', status: 'Hadir', time: '07:20:45' },
                    { name: 'Muhammad Faiz', status: 'Lewat', time: '07:45:12' }
                ];
            }
            
            // Update UI
            const recentList = document.getElementById('recentList');
            recentList.innerHTML = recentScans.map(scan => `
                <div class="recent-item">
                    <i class="fas fa-check-circle" style="color: ${scan.status === 'Hadir' ? 'var(--success)' : 'var(--warning)'}"></i>
                    <div class="recent-info">
                        <div class="name">${scan.name}</div>
                        <div class="meta">${scan.status}</div>
                    </div>
                    <div class="recent-time">${scan.time}</div>
                </div>
            `).join('');
        }
    </script>
</body>
