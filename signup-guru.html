<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Daftar Akaun Baru Guru</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        :root {
            --primary: #4158F0;
            --primary-dark: #2a3bb0;
            --secondary: #C850C0;
            --success: #06d6a0;
            --danger: #FF6B6B;
            --warning: #FFB347;
            --dark: #1e1e2f;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.05);
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #141e30, #243b55);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Background Animation */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            filter: blur(80px);
            opacity: 0.15;
            animation: float 20s infinite ease-in-out;
        }

        .circle1 {
            width: 500px;
            height: 500px;
            top: -100px;
            right: -100px;
        }

        .circle2 {
            width: 400px;
            height: 400px;
            bottom: -100px;
            left: -100px;
            background: linear-gradient(135deg, var(--secondary), #FFCC70);
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(50px, 50px); }
        }

        /* Auth Container */
        .auth-container {
            width: 100%;
            max-width: 500px;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 20px;
            opacity: 0.8;
            transition: all 0.3s;
        }

        .back-btn:hover {
            opacity: 1;
            transform: translateX(-5px);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header i {
            font-size: 3rem;
            color: var(--primary);
            background: rgba(65, 88, 240, 0.2);
            padding: 20px;
            border-radius: 30px;
            margin-bottom: 20px;
        }

        .auth-header h2 {
            color: white;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .auth-header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95rem;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: white;
            margin-bottom: 8px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .form-group label i {
            margin-right: 8px;
            color: var(--primary);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper > i:first-child {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .input-wrapper input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 3px rgba(65, 88, 240, 0.2);
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.3s;
        }

        .toggle-password:hover {
            color: var(--primary);
        }

        /* Email Valid Indicator */
        .email-valid-indicator {
            position: absolute;
            right: 45px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
        }

        .valid-email {
            color: var(--success);
        }

        .invalid-email {
            color: var(--danger);
        }

        /* Password Strength */
        .password-strength {
            margin-top: 8px;
        }

        .strength-bar {
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            transition: all 0.3s;
        }

        .strength-text {
            font-size: 0.8rem;
            margin-top: 5px;
            color: rgba(255, 255, 255, 0.5);
        }

        /* Terms */
        .terms {
            margin: 20px 0;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            cursor: pointer;
        }

        .checkbox input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .checkbox a {
            color: var(--primary);
            text-decoration: none;
        }

        .checkbox a:hover {
            text-decoration: underline;
        }

        /* Button */
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 15px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 10px 30px rgba(65, 88, 240, 0.4);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(65, 88, 240, 0.6);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Alert */
        .alert {
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-success {
            background: rgba(6, 214, 160, 0.2);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .alert-danger {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        .alert-warning {
            background: rgba(255, 179, 71, 0.2);
            border: 1px solid var(--warning);
            color: var(--warning);
        }

        .alert-info {
            background: rgba(65, 88, 240, 0.2);
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        /* Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s infinite linear;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Auth Footer */
        .auth-footer {
            text-align: center;
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95rem;
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .auth-footer a:hover {
            color: var(--secondary);
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .auth-card {
                padding: 30px 20px;
            }

            .auth-header h2 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- Background Animation -->
    <div class="bg-animation">
        <div class="bg-circle circle1"></div>
        <div class="bg-circle circle2"></div>
    </div>

    <!-- Main Container -->
    <div class="auth-container">
        <div class="auth-card">
            <!-- Back Button -->
            <a href="index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i>
                Kembali ke Utama
            </a>

            <!-- Header -->
            <div class="auth-header">
                <i class="fas fa-user-plus"></i>
                <h2>Daftar Akaun Baru Guru</h2>
                <p>Isi maklumat untuk mendaftar sebagai guru SEMSIRA</p>
            </div>

            <!-- Alert Container -->
            <div id="alertContainer"></div>

            <!-- Signup Form -->
            <form id="signupForm">
                <!-- Nama Penuh -->
                <div class="form-group">
                    <label>
                        <i class="fas fa-user"></i>
                        Nama Penuh
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input 
                            type="text" 
                            id="fullname" 
                            placeholder="Ahmad bin Ali"
                            required
                        >
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label>
                        <i class="fas fa-envelope"></i>
                        Alamat Email
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input 
                            type="email" 
                            id="email" 
                            placeholder="nama@email.com"
                            required
                        >
                        <span id="emailIndicator" class="email-valid-indicator"></span>
                    </div>
                </div>

                <!-- No Telefon -->
                <div class="form-group">
                    <label>
                        <i class="fas fa-phone"></i>
                        Nombor Telefon
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone"></i>
                        <input 
                            type="tel" 
                            id="phone" 
                            placeholder="012-3456789"
                            required
                        >
                    </div>
                </div>

                <!-- Kata Laluan -->
                <div class="form-group">
                    <label>
                        <i class="fas fa-lock"></i>
                        Kata Laluan
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="Min 6 aksara"
                            required
                            minlength="6"
                        >
                        <span class="toggle-password" onclick="togglePassword('password', 'toggleIcon1')">
                            <i class="fas fa-eye" id="toggleIcon1"></i>
                        </span>
                    </div>
                    <div class="password-strength" id="passwordStrength">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>
                        <div class="strength-text" id="strengthText"></div>
                    </div>
                </div>

                <!-- Sahkan Kata Laluan -->
                <div class="form-group">
                    <label>
                        <i class="fas fa-lock"></i>
                        Sahkan Kata Laluan
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            placeholder="Taip semula kata laluan"
                            required
                            minlength="6"
                        >
                        <span class="toggle-password" onclick="togglePassword('confirmPassword', 'toggleIcon2')">
                            <i class="fas fa-eye" id="toggleIcon2"></i>
                        </span>
                    </div>
                </div>

                <!-- Terms -->
                <div class="terms">
                    <label class="checkbox">
                        <input type="checkbox" id="terms" required>
                        <span>Saya bersetuju dengan <a href="#">Terma & Syarat</a> dan <a href="#">Dasar Privasi</a> SEMSIRA.</span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary" id="signupBtn">
                    <i class="fas fa-user-check"></i>
                    Daftar Akaun
                </button>
            </form>

            <!-- Footer -->
            <div class="auth-footer">
                <p>Sudah mempunyai akaun?</p>
                <a href="login-guru.html">
                    <i class="fas fa-sign-in-alt"></i>
                    Log Masuk di sini
                </a>
            </div>
        </div>
    </div>

    <!-- Database JavaScript File -->
    <script src="js/database.js"></script>
    
    <script>
        // ===== PASSWORD TOGGLE =====
        function togglePassword(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const toggleIcon = document.getElementById(iconId);
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                toggleIcon.className = 'fas fa-eye';
            }
        }

        // ===== VALIDATE EMAIL FORMAT =====
        function validateEmailFormat(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        // ===== CHECK DOMAIN EXISTS =====
        async function checkDomainExists(domain) {
            // Domain yang biasa digunakan
            const validDomains = [
                'gmail.com', 
                'yahoo.com', 
                'hotmail.com', 
                'outlook.com',
                'edu.my',
                'moe.edu.my',
                'guru.edu.my',
                'smkss.edu.my'
            ];
            
            return validDomains.includes(domain.toLowerCase());
        }

        // ===== VALIDATE EMAIL REAL-TIME =====
        async function validateEmail(email) {
            const indicator = document.getElementById('emailIndicator');
            
            if (!email) {
                indicator.innerHTML = '';
                return false;
            }

            if (!validateEmailFormat(email)) {
                indicator.innerHTML = '<i class="fas fa-times-circle invalid-email"></i>';
                return false;
            }

            try {
                indicator.innerHTML = '<div class="spinner" style="width: 15px; height: 15px;"></div>';
                
                const domain = email.split('@')[1];
                const isValid = await checkDomainExists(domain);
                
                if (isValid) {
                    indicator.innerHTML = '<i class="fas fa-check-circle valid-email"></i>';
                    return true;
                } else {
                    indicator.innerHTML = '<i class="fas fa-exclamation-circle invalid-email"></i>';
                    return false;
                }
            } catch (error) {
                indicator.innerHTML = '<i class="fas fa-check-circle valid-email"></i>';
                return true;
            }
        }

        // ===== CHECK EMAIL UNIQUE =====
        function isEmailUnique(email) {
            const gurus = getGuruDatabase();
            return !gurus.some(g => g.email === email);
        }

        // ===== PASSWORD STRENGTH =====
        function checkPasswordStrength(password) {
            let strength = 0;
            
            if (password.length >= 6) strength += 20;
            if (password.length >= 8) strength += 20;
            if (/[A-Z]/.test(password)) strength += 20;
            if (/[0-9]/.test(password)) strength += 20;
            if (/[^A-Za-z0-9]/.test(password)) strength += 20;
            
            return strength;
        }

        function updatePasswordStrength() {
            const password = document.getElementById('password').value;
            const strength = checkPasswordStrength(password);
            const fill = document.getElementById('strengthFill');
            const text = document.getElementById('strengthText');
            
            fill.style.width = strength + '%';
            
            if (strength < 40) {
                fill.style.background = 'var(--danger)';
                text.textContent = 'Lemah';
                text.style.color = 'var(--danger)';
            } else if (strength < 70) {
                fill.style.background = 'var(--warning)';
                text.textContent = 'Sederhana';
                text.style.color = 'var(--warning)';
            } else {
                fill.style.background = 'var(--success)';
                text.textContent = 'Kuat';
                text.style.color = 'var(--success)';
            }
        }

        // ===== SHOW ALERT =====
        function showAlert(message, type = 'danger') {
            const alertContainer = document.getElementById('alertContainer');
            const icons = {
                success: 'fa-check-circle',
                danger: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };
            
            alertContainer.innerHTML = `
                <div class="alert alert-${type}">
                    <i class="fas ${icons[type]}"></i>
                    <span>${message}</span>
                </div>
            `;
            
            setTimeout(() => {
                alertContainer.innerHTML = '';
            }, 5000);
        }

        // ===== HANDLE SIGNUP =====
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const fullname = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;
            
            const signupBtn = document.getElementById('signupBtn');
            
            // Disable button
            signupBtn.disabled = true;
            signupBtn.innerHTML = '<div class="spinner"></div> Memproses...';
            
            try {
                // Validate email format
                const isValidEmail = await validateEmail(email);
                if (!isValidEmail) {
                    showAlert('Alamat email tidak sah', 'danger');
                    signupBtn.disabled = false;
                    signupBtn.innerHTML = '<i class="fas fa-user-check"></i> Daftar Akaun';
                    return;
                }
                
                // Check unique email
                if (!isEmailUnique(email)) {
                    showAlert('Email sudah berdaftar. Sila gunakan email lain.', 'warning');
                    signupBtn.disabled = false;
                    signupBtn.innerHTML = '<i class="fas fa-user-check"></i> Daftar Akaun';
                    return;
                }
                
                // Check password match
                if (password !== confirmPassword) {
                    showAlert('Kata laluan tidak sepadan', 'danger');
                    signupBtn.disabled = false;
                    signupBtn.innerHTML = '<i class="fas fa-user-check"></i> Daftar Akaun';
                    return;
                }
                
                // Check password strength
                if (password.length < 6) {
                    showAlert('Kata laluan mesti sekurang-kurangnya 6 aksara', 'danger');
                    signupBtn.disabled = false;
                    signupBtn.innerHTML = '<i class="fas fa-user-check"></i> Daftar Akaun';
                    return;
                }
                
                // Check terms
                if (!terms) {
                    showAlert('Sila setuju dengan Terma & Syarat', 'warning');
                    signupBtn.disabled = false;
                    signupBtn.innerHTML = '<i class="fas fa-user-check"></i> Daftar Akaun';
                    return;
                }
                
                // Create new guru
                const gurus = getGuruDatabase();
                const newGuru = {
                    id: Date.now(),
                    name: fullname,
                    email: email,
                    phone: phone,
                    password: password,
                    registerDate: new Date().toISOString().split('T')[0],
                    status: 'active'
                };
                
                gurus.push(newGuru);
                saveGuruDatabase(gurus);
                
                showAlert('Pendaftaran berjaya! Sila log masuk.', 'success');
                
                // Clear form
                document.getElementById('signupForm').reset();
                
                // Redirect to login after 2 seconds
                setTimeout(() => {
                    window.location.href = 'login-guru.html';
                }, 2000);
                
            } catch (error) {
                console.error('Signup error:', error);
                showAlert('Ralat sistem. Sila cuba lagi.', 'danger');
                
                signupBtn.disabled = false;
                signupBtn.innerHTML = '<i class="fas fa-user-check"></i> Daftar Akaun';
            }
        });

        // ===== REAL-TIME VALIDATIONS =====
        document.getElementById('email').addEventListener('input', function() {
            validateEmail(this.value);
        });
        
        document.getElementById('password').addEventListener('input', updatePasswordStrength);
        
        document.getElementById('confirmPassword').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirm = this.value;
            
            if (confirm && password !== confirm) {
                this.style.borderColor = 'var(--danger)';
            } else if (confirm && password === confirm) {
                this.style.borderColor = 'var(--success)';
            } else {
                this.style.borderColor = '';
            }
        });

        // ===== CHECK SESSION =====
        function checkExistingSession() {
            const currentUser = localStorage.getItem('semsira_current_user') || sessionStorage.getItem('semsira_current_user');
            
            if (currentUser) {
                const user = JSON.parse(currentUser);
                if (user.role === 'guru') {
                    window.location.href = 'dashboard-guru.html';
                }
            }
        }

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', function() {
            checkExistingSession();
        });
    </script>
</body>
</html>
